services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agnos}
      POSTGRES_USER: ${POSTGRES_USER:-agnos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agnos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agnos} -d ${POSTGRES_DB:-agnos}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    command:
      - postgres
      - postgres://${POSTGRES_USER:-agnos}:${POSTGRES_PASSWORD:-agnos}@postgres:5432/${POSTGRES_DB:-agnos}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  hospital-a-mock:
    build:
      context: ./hospital-a-mock
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      GIN_MODE: release
      DATABASE_URL: postgres://${POSTGRES_USER:-agnos}:${POSTGRES_PASSWORD:-agnos}@postgres:5432/${POSTGRES_DB:-agnos}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      JWT_EXPIRY: ${JWT_EXPIRY:-1h}
    depends_on:
      migrate:
        condition: service_completed_successfully
      hospital-a-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine3.24-slim
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
